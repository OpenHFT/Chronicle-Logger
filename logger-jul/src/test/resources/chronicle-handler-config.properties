.level=ALL

net.openhft.chronicle.logger.jul.ChronicleHandler.path=${chronicle.handler.base}/config-test
net.openhft.chronicle.logger.jul.ChronicleHandler.level=FINE
net.openhft.chronicle.logger.jul.ChronicleHandler.filter=net.openhft.chronicle.logger.jul.support.AllowAllFilter
net.openhft.chronicle.logger.jul.ChronicleHandler.cfg.blockSize=32
net.openhft.chronicle.logger.jul.ChronicleHandler.cfg.bufferCapacity=64
net.openhft.chronicle.logger.jul.ChronicleHandler.cfg.rollCycle=FAST_DAILY
net.openhft.chronicle.logger.jul.ChronicleHandler.wireType=TEXT
net.openhft.chronicle.logger.jul.ChronicleHandler.enabled=1

config-logger.level=ALL
config-logger.handlers=net.openhft.chronicle.logger.jul.ChronicleHandler
config-logger.useParentHandlers=false
